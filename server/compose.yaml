services:
  api:
    build: .
    ports:
      - "${FOOTMARKS_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      FOOTMARKS_DATABASE_URL: sqlite:////app/data/footmarks.db
      FOOTMARKS_TOKEN_SECRET: ${FOOTMARKS_TOKEN_SECRET:?Set FOOTMARKS_TOKEN_SECRET in server/.env}
      FOOTMARKS_PUBLIC_REGISTRATION_ENABLED: ${FOOTMARKS_PUBLIC_REGISTRATION_ENABLED:-false}
      FOOTMARKS_TOKEN_QUOTA_ENABLED: ${FOOTMARKS_TOKEN_QUOTA_ENABLED:-false}
      FOOTMARKS_DEFAULT_MONTHLY_TOKEN_LIMIT: ${FOOTMARKS_DEFAULT_MONTHLY_TOKEN_LIMIT:-50000}
      FOOTMARKS_PHOTO_STORAGE_LIMIT_BYTES: ${FOOTMARKS_PHOTO_STORAGE_LIMIT_BYTES:-104857600}
      FOOTMARKS_COS_BUCKET: ${FOOTMARKS_COS_BUCKET:-footmark-1489262329}
      FOOTMARKS_COS_REGION: ${FOOTMARKS_COS_REGION:-ap-hongkong}
      FOOTMARKS_COS_DOMAIN: ${FOOTMARKS_COS_DOMAIN:-https://footmark-1489262329.cos.ap-hongkong.myqcloud.com}
      FOOTMARKS_COS_SECRET_ID: ${FOOTMARKS_COS_SECRET_ID:-}
      FOOTMARKS_COS_SECRET_KEY: ${FOOTMARKS_COS_SECRET_KEY:-}
      FOOTMARKS_COS_SESSION_TOKEN: ${FOOTMARKS_COS_SESSION_TOKEN:-}
      FOOTMARKS_COS_URL_EXPIRE_SECONDS: ${FOOTMARKS_COS_URL_EXPIRE_SECONDS:-3600}
      FOOTMARKS_AMAP_WEB_KEY: ${FOOTMARKS_AMAP_WEB_KEY:-}
      FOOTMARKS_AMAP_BASE_URL: ${FOOTMARKS_AMAP_BASE_URL:-https://restapi.amap.com}
      FOOTMARKS_AMAP_TIMEOUT_SECONDS: ${FOOTMARKS_AMAP_TIMEOUT_SECONDS:-10}
      FOOTMARKS_LLM_BASE_URL: ${FOOTMARKS_LLM_BASE_URL:-}
      FOOTMARKS_LLM_API_KEY: ${FOOTMARKS_LLM_API_KEY:-}
      FOOTMARKS_LLM_MODEL: ${FOOTMARKS_LLM_MODEL:-}
      FOOTMARKS_LLM_STRUCTURED_OUTPUT_MODE: ${FOOTMARKS_LLM_STRUCTURED_OUTPUT_MODE:-json_schema}
      FOOTMARKS_LLM_TIMEOUT_SECONDS: ${FOOTMARKS_LLM_TIMEOUT_SECONDS:-30}
      FOOTMARKS_LLM_MAX_RETRIES: ${FOOTMARKS_LLM_MAX_RETRIES:-1}
      FOOTMARKS_AGENT_TOTAL_TIMEOUT_SECONDS: ${FOOTMARKS_AGENT_TOTAL_TIMEOUT_SECONDS:-120}
      FOOTMARKS_AGENT_STAGE_TIMEOUT_SECONDS: ${FOOTMARKS_AGENT_STAGE_TIMEOUT_SECONDS:-60}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
