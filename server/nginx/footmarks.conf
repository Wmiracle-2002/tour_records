log_format footmarks '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'request_id=$request_id request_time=$request_time '
    'upstream_response_time=$upstream_response_time upstream_status=$upstream_status';

server {
    listen 80;
    listen [::]:80;
    server_name cq-footmark.online www.cq-footmark.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cq-footmark.online www.cq-footmark.online;

    ssl_certificate /etc/nginx/cq-footmark.online_bundle.crt;
    ssl_certificate_key /etc/nginx/cq-footmark.online.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 150s;
        send_timeout 15s;
    }

    access_log /var/log/nginx/access.log footmarks;
}
